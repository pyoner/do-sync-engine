setup:
  database:
    - CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, actor_id INTEGER)
    - CREATE TABLE main.archive_users (id INTEGER PRIMARY KEY, name TEXT, actor_id INTEGER)
    - CREATE TABLE "audit log" (id INTEGER PRIMARY KEY)
    - CREATE TABLE main.events (id INTEGER PRIMARY KEY, actor_id INTEGER)
    - CREATE TABLE actors (id INTEGER PRIMARY KEY)
  seed:
    - INSERT INTO users (id, name) VALUES (1, 'Ada')
    - INSERT INTO main.events (id, actor_id) VALUES (1, 1)
    - INSERT INTO actors (id) VALUES (1)
testData:
  - sql: INSERT INTO users (name) VALUES ('Ada')
    tables: [users]
  - sql: INSERT INTO main.archive_users SELECT * FROM users
    tables: [main.archive_users]
  - sql: INSERT INTO "audit log" (id) SELECT e.id FROM main.events e JOIN actors a ON a.id = e.actor_id
    tables: [audit log]
