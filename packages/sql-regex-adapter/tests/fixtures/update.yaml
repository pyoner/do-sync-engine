- sql: UPDATE users SET name = 'Ada' WHERE id = 1
  tables: [users]
- sql: UPDATE users u SET name = source.name FROM user_names source WHERE source.id = u.id
  tables: [users, user_names]
- sql: UPDATE tenant.users AS u SET name = x.name FROM tenant.names AS x JOIN tenant.active a ON a.id = x.id
  tables: [tenant.users, tenant.names, tenant.active]
