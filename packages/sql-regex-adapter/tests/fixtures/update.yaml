setup:
  database:
    - CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, manager_id INTEGER)
    - CREATE TABLE user_names (id INTEGER PRIMARY KEY, name TEXT)
  seed:
    - INSERT INTO users (id, name) VALUES (1, 'Before')
    - INSERT INTO user_names (id, name) VALUES (1, 'Ada')
testData:
  - sql: UPDATE users SET name = ? WHERE id = ?
    params: [Ada, 1]
    tables: [users]
  - sql: UPDATE users SET name = ?, manager_id = ? WHERE id = ?
    params: [Ada, 1, 1]
    tables: [users]
  - sql: UPDATE users SET name = ?, manager_id = ? WHERE id = ? AND name = ?
    params: [Grace, null, 1, Before]
    tables: [users]
  - sql: UPDATE users SET name = (SELECT name FROM user_names WHERE user_names.id = users.id) WHERE id = 1
    tables: [users]
  - sql: UPDATE main.users SET name = (SELECT name FROM main.user_names WHERE main.user_names.id = main.users.id) WHERE id = 1
    tables: [main.users]
